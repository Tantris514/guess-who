; Local development only (not packaged): lets the build scripts run Python in the open editor.
; Loopback only, multicast TTL 0 so nothing leaves this PC. Delete this file to turn it off.
[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
bRemoteExecution=True
RemoteExecutionMulticastGroupEndpoint=239.0.0.1:6766
RemoteExecutionMulticastBindAddress=127.0.0.1
RemoteExecutionMulticastTtl=0

; Leave 8 of 16 threads free while shaders compile, so ComfyUI keeps running smoothly (dev machine only).
[DevOptions.Shaders]
NumUnusedShaderCompilingThreads=8
